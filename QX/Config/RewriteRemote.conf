# Quantumult X 主配置片段：远程重写索引
# 本文件不是可直接放进「重写 → 引用」的远程重写资源！
# 用法：将 [rewrite_remote] 下的订阅行加入现有 QX 主配置的同名分区，
# 不要建立重复的 [rewrite_remote] 分区。
# 已有 QX 引用的规则不要重复添加；保留原始订阅即可。
# 第三方资源仍从作者仓库读取，以便自动更新。

[rewrite_remote]
# 本仓库自维护规则
https://raw.githubusercontent.com/LiRayX/Proxy-Rules/main/QX/Rewrite/MyAds.conf, tag=MyAds, enabled=true

# 墨鱼专项（来源路径已核实，是否与现有订阅重复须自行检查）
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/AmapAds.conf, tag=Moyu-Amap, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/GoofishAds.conf, tag=Moyu-Goofish, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf, tag=Moyu-YouTube, enabled=true

# 网页功能增强（并非广告拦截）
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/Html/Q-Search.conf, tag=Moyu-SafariSearch, enabled=true
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/Html/General.conf, tag=Google-Redirect, enabled=true

# 其余截图中已启用资源：小红书、百度网盘、微信 URL 解锁、BOXJS 等，
# 尚未核实完整原始 URL，暂不写入可能错误的订阅；保持 QX 现有引用不变。
