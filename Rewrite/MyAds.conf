^https?:\/\/app\.bilibili\.com\/x\/v2\/splash\/list(?:\?|$) url script-response-body https://raw.githubusercontent.com/app2smile/rules/master/js/bilibili-json.js

# QQ 音乐：Moli 开屏素材
